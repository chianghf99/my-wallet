name: 測試

# 每次推上 main 就跑。
#
# 為什麼不塞進 daily-snapshot.yml：那支是排程工作，平日 06:37 UTC 才跑一次。
# 回歸測試要在「改壞的當下」就紅，不是等隔天排程；而且卡片管家的加解密跟每日
# 快照毫無關係，讓它去擋快照寫入也不合理。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 估值、期貨取價、快照日期與本地日期邏輯
      - name: 估值、期貨取價、快照與日期邏輯
        run: |
          node scripts/test-valuation.mjs
          node scripts/test-futures.mjs
          node scripts/test-snapshot.mjs
          node scripts/test-format.mjs

      # 守住「既有加密資料還解得開」這條底線：金鑰參數被改動、或密文格式變了，
      # 這裡就會紅。詳見 scripts/test-card-crypto.mjs 的檔頭說明。
      - name: 卡片管家加解密黃金樣本
        run: node scripts/test-card-crypto.mjs

      # 上傳前合併雲端帳單的判斷。這段有兩個反方向的失敗模式（漏接別處新增的帳單／
      # 讓刪除失效），兩者都不會當場報錯，所以釘在 CI 上。
      - name: 卡片管家雲端同步合併
        run: node scripts/test-bill-sync.mjs

      # 帳單到期提醒的挑選邏輯。失敗模式同樣是安靜的：提醒不會噴錯，只是不出現
      # 或是把天數算錯一天（時區），要等到帳單逾期才會發現。
      - name: 帳單到期提醒挑選邏輯
        run: node scripts/test-bill-reminder.mjs

      # 銀行每隔一段時間就改帳單版面，而改版造成的解析失敗完全沒有徵兆
      # （抓不到日期、或更糟：抓到錯的日期與金額）。每修好一家就留一份假數字樣本釘住。
      - name: 帳單 PDF 解析規則
        run: node scripts/test-bill-parse.mjs

      # 帳單機器人跑在使用者的 Mac 上，推播是它唯一的對外管道 ——
      # 「推播送不出去」這件事本身絕對不能安靜（實際踩過：Telegram 回 403，
      # 而 --telegram-test 照報成功）。這支不碰網路、不碰 Keychain，
      # pdfplumber 是延遲匯入的，所以在 CI 上也跑得動。
      - name: 帳單機器人推播回傳值與快照發射器
        run: |
          python3 scripts/billbot/test_bill_bot.py
          python3 scripts/test_trigger_snapshot.py

      # 這個 repo 是 public，Actions 日誌不需登入就看得到。排程的每個 console.log
      # 都是人工挑過的，唯一不受控的是 catch 印出來的錯誤 —— 那串字是
      # firebase-admin 給的，裡面會帶含 uid 的文件路徑。它只在排程真的壞掉的
      # 那一天才印，所以沒有人會注意到它順手洩漏了什麼，只能靠測試釘住。
      - name: 公開日誌不得出現 uid
        run: node scripts/test-log-redact.mjs
