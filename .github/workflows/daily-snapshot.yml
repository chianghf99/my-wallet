name: 每日資產快照

on:
  schedule:
    # GitHub 的排程不保證準時：實測設在 06:30 UTC 的那次完全沒觸發，改用零散的
    # 分鐘數之後才每次都有跑到。
    #
    # ⚠️ 2026-11-22 重新量過，延遲比這段註解原本寫的嚴重一個數量級。
    # 原本寫「曾延遲 67～151 分鐘」—— 那是早期的觀測值，已經完全不成立。
    # 近 20 天 21 次排程執行，相對預定的 14:37：
    #   週一 中位數 9.9 小時（最大 611 分）   週五 8.2 小時
    #   週二 8.6 小時                          週六 7.1 小時
    #   週三 8.2 小時                          週日 7.6 小時
    #   週四 8.9 小時
    # 93 次的完整樣本裡 45 次延遲超過 6 小時，最大 741 分（12.3 小時）。
    # 週一最嚴重（GitHub 的排程佇列最滿）。
    #
    # 想重新量（不要信上面的數字，它會再過期）：
    #   curl -s "https://api.github.com/repos/chianghf99/my-wallet/actions/\
    #   workflows/daily-snapshot.yml/runs?per_page=100&event=schedule"
    # 取每筆的 run_started_at（UTC），加 8 小時得台北時間，與當天 14:37 相減。
    #
    # 原本這裡寫「期貨已固定採用日盤收盤價（見 js/utils/futures.js 的
    # pickDaySessionFirst），因此延遲多久都不影響記錄的數字」——
    # ⚠️ 這句只在「不跨過台北午夜」時成立。snapshot.mjs 的 getTaipeiDate() 取的是
    # **執行當下**的台北日期，不是「這份快照代表哪個交易日的收盤」。所以延遲一旦跨過
    # 午夜，那天的資料會被寫到隔天那份文件上，結果是：
    #   前一天完全沒有快照（走勢圖的洞），隔天被寫兩次。
    # 實際發生過：2026-11-09（一）與 11-16（一）沒有快照，
    # 而 11-03、11-10、11-18 各被寫兩次 —— 成對出現就是這個機制。
    # 93 次樣本裡有 7 次跨過午夜；11-19 那次落在 23:59，離邊界只差一分鐘。
    #
    # 真要修的話，方向是讓日期來自「這份快照代表哪個交易日」而不是 wall clock
    # （執行時刻在台北 14:00 之前就算前一天 —— 台股 13:30、期貨日盤 13:45 收盤，
    # 14:00 前執行的排程拿到的必然是前一天的收盤價）。
    # 2026-11-23 已於 scripts/snapshot-core.mjs 實作（resolveSnapshotDate）：
    #   - 台北小時 < 14 自動退回前一天（同時覆蓋「GitHub 延遲跨過午夜」與「筆電隔天早上開機補跑」）
    #   - 保留這個 schedule 作為 Windows 筆電死掉時的保底，且不跳過已存在的快照
    #     （較晚執行的那次可用最新報價覆蓋早上的瞬斷舊價；筆電觸發寫入的 dispatchedAt
    #     在 schedule merge 時不會被洗掉，由 bill-reminder.mjs 看門狗監看筆電是否存活）
    #
    # 改為每天都跑（原本只有週一到週五）。週末雖然台股與期貨休市，仍有兩個理由：
    #   1. 週六這一次會抓到「週五的美股收盤」。週五 14:37 台北執行時，美股最近一次
    #      收盤其實是週四的那場（週五美股收在台北週六凌晨），所以週五的快照拿不到它。
    #   2. 走勢圖不再有週末缺口。
    # 週末安全性已驗證：匯率 API 假日照常回應；台股／期貨報價抓不到時只會沿用
    # 資料庫既有價格（見 processUser 的「已沿用資料庫既有價格」），不會中止整支程式。
    - cron: '37 6 * * *'   # 每天 14:37 台北（台股 13:30、期貨日盤 13:45 收盤後）
  workflow_dispatch:       # 允許由家裡 24h 筆電準時觸發，或在 Actions 頁面手動觸發
    inputs:
      target_date:
        description: '手動指定寫入日期（YYYY-MM-DD，留空則依台北 14:00 門檻自動判斷）'
        required: false
        type: string

# 預設沒有任何權限，這個工作只需要對外抓報價與寫 Firestore
permissions: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 安裝相依套件
        working-directory: scripts
        run: npm install --no-audit --no-fund

      # 估值、期貨取價、快照日期歸屬是核心邏輯，先跑回歸測試確認公式沒被改壞，
      # 失敗就中止，不要把錯誤的數字或錯的日期寫進歷史紀錄。
      - name: 驗證估值、期貨取價與快照日期邏輯
        run: |
          node scripts/test-valuation.mjs
          node scripts/test-futures.mjs
          node scripts/test-snapshot.mjs

      - name: 寫入每日快照
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          APP_UID: ${{ secrets.APP_UID }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: node snapshot.mjs

      # 快照排程自己失敗時，發送固定通知給秘書「小艾」聊天室（IRIS_BOT_TOKEN），
      # 不發往信用卡帳單聊天室；若尚未設定 IRIS_BOT_TOKEN 則靜默略過。
      - name: 失敗時通知秘書小艾（Telegram）
        if: failure()
        env:
          IRIS_BOT_TOKEN: ${{ secrets.IRIS_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$IRIS_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS -X POST "https://api.telegram.org/bot$IRIS_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=❌ 每日資產快照排程失敗了（GitHub Actions）。請到 repo 的 Actions 頁面查看哪一步紅了。這則是固定訊息，不含執行內容。" \
              -o /dev/null
          fi
