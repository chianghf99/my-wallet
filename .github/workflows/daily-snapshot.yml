name: 每日資產快照

on:
  schedule:
    # GitHub 的排程不保證準時，高負載時會延遲、甚至「整次丟棄不執行」。
    # 實測 2026-07-27 設在 06:30 UTC 的那次就完全沒觸發，因此：
    #   1. 避開整點與半點這類人人都在用的時段，改用零散的分鐘數
    #   2. 多排一次當保險。快照是寫入當日同一份文件（set + merge），
    #      重複執行只是用較新的報價覆蓋，不會產生重複資料。
    - cron: '37 6 * * 1-5'   # 14:37 台北（台股 13:30、期貨 13:45 收盤後）
    - cron: '13 8 * * 1-5'   # 16:13 台北（保險，前一次若被丟棄仍能補上）
  workflow_dispatch: {}   # 允許在 Actions 頁面手動觸發，方便測試

# 預設沒有任何權限，這個工作只需要對外抓報價與寫 Firestore
permissions: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 安裝相依套件
        working-directory: scripts
        run: npm install --no-audit --no-fund

      # 估值邏輯是前端與排程共用的，先跑回歸測試確認公式沒被改壞，
      # 失敗就中止，不要把錯誤的數字寫進歷史紀錄。
      - name: 驗證估值與期貨取價邏輯
        run: |
          node scripts/test-valuation.mjs
          node scripts/test-futures.mjs

      - name: 寫入每日快照
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          APP_UID: ${{ secrets.APP_UID }}
        run: node snapshot.mjs
