name: 帳單到期提醒

on:
  schedule:
    # 每天 07:47 台北（23:47 UTC）。
    #
    # 為什麼排這麼早：GitHub 的排程不保證準時，這個 repo 實測延遲過 67～151 分鐘
    # （見 daily-snapshot.yml 的註解）。排在 07:47 可以讓訊息大致落在早上 8 點到
    # 10 點之間 —— 還來得及當天去繳。分鐘數刻意用零散數字，整點的排程比較容易被跳過。
    #
    # 漏跑一天的代價有限：到期前第 3 天與第 1 天各提醒一次，再加上當天一定會提醒，
    # 同一筆帳單總共有三次機會，不會因為單日沒跑就完全錯過。
    - cron: '47 23 * * *'
  workflow_dispatch:      # 可在 Actions 頁面手動觸發，方便測試
    inputs:
      dry_run:
        description: '只檢查不送出（日誌只會印筆數，不印內容）'
        type: boolean
        default: false
      test_send:
        description: '測試送出：就算沒有帳單快到期也發一則，用來確認 Telegram 真的通'
        type: boolean
        default: false

# 預設沒有任何權限，這個工作只需要讀 Firestore 與打 Telegram API
permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 安裝相依套件
        working-directory: scripts
        run: npm install --no-audit --no-fund

      # 挑選邏輯錯掉不會有任何徵兆 —— 提醒不會噴錯，只是安靜地不出現或晚一天。
      # 先跑回歸測試，紅了就不要送出一則算錯的提醒。
      - name: 驗證提醒挑選邏輯
        run: node scripts/test-bill-reminder.mjs

      - name: 送出提醒
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # APP_UID 是每日快照用的，可以有多組；提醒只有一個收件人，所以多組時
          # 必須另外用 REMINDER_UID 指名要提醒誰。APP_UID 只有一組時可以不設。
          APP_UID: ${{ secrets.APP_UID }}
          REMINDER_UID: ${{ secrets.REMINDER_UID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_SEND: ${{ inputs.test_send }}
          # 想改提醒時機或訊息詳細程度，在這裡加環境變數即可，
          # 可用的選項見 scripts/bill-reminder.mjs 的檔頭。
        run: node bill-reminder.mjs
